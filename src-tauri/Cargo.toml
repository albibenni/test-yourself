[package]
name = "test-yourself"
version = "4.0.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
pulldown-cmark = "0.13.4"
tokio = { version = "1.52.3", features = ["fs"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-process = "2"
keyring = "4.1.5"
keyring-core = "1.0.0"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-os = "2"
obsidian-folder-picker = { path = "obsidian-folder-picker" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["rt", "macros"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

# iOS requires the protected Keychain entitlement in apple-native-keyring-store.
# This target dependency enables the feature on the transitive keyring backend
# without pulling the CLI-only backends into desktop builds.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
